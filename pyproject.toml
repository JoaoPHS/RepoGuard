[project]
name = "repoguard"
version = "0.1.0"
description = "Veredito de clonagem para repositórios do GitHub, consultando só a API."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
repoguard = "repoguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
